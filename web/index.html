<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RetroChat</title>
  <style>
:root{
  --bg:#111827; --bg-strong:#0b1220; --panel:#1f2937; --panel-alt:#111827; --toolbar-bg:#0f172a; --toolbar-border:#374151; --text:#e5e7eb; --text-weak:#cbd5e1; --muted:#9ca3af; --btn-bg:#1f2937; --btn-border:#475569; --input-bg:#0f172a; --input-border:#475569; --panel-border:#374151; --chat-bg:#0b1220; --status-bg:#000; --status-fg:#7ef9a8; --attachment-bg:#111827; --attachment-border:#475569; --drop-border:#64748b; --drop-hover:#1e293b; --accent:#60a5fa; --accent-strong:#2563eb; --link:#93c5fd; --shadow:rgba(15,23,42,.45)
}
body[data-theme="light"]{
  --bg:#c0c0c0; --bg-strong:#d4d0c8; --panel:#d4d0c8; --panel-alt:#c0c0c0; --toolbar-bg:#c0c0c0; --toolbar-border:#808080; --text:#111827; --text-weak:#1f2937; --muted:#4b5563; --btn-bg:#d4d0c8; --btn-border:#ffffff; --input-bg:#ffffff; --input-border:#bfc5ce; --panel-border:#ffffff; --chat-bg:#ffffff; --status-bg:#000; --status-fg:#0f0; --attachment-bg:#f3f4f6; --attachment-border:#9ca3af; --drop-border:#777; --drop-hover:#e5e7eb; --accent:#000080; --accent-strong:#1084d7; --link:#0055aa; --shadow:rgba(0,0,0,.08)
}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);font-family:"Courier New",monospace;color:var(--text);font-size:14px}.window{width:100%;height:100%;margin:auto;background:var(--bg);display:flex;flex-direction:column}.title{height:32px;cursor:move;user-select:none;-webkit-user-select:none;background:linear-gradient(90deg,#000080,#1084d7);color:#fff;font-weight:bold;padding:7px 10px;display:flex;justify-content:space-between}.toolbar{display:flex;gap:4px;padding:5px;border-bottom:2px solid var(--toolbar-border);background:var(--toolbar-bg);flex-wrap:wrap}.btn{border:2px outset var(--btn-border);background:var(--btn-bg);color:var(--text);padding:5px 10px;font:inherit;cursor:pointer}.btn:active{border-style:inset}.main{display:grid;grid-template-columns:310px 1fr;gap:8px;padding:8px;min-height:0;flex:1;height:100%}.side{display:flex;flex-direction:column;min-height:0;height:100%}.panel{background:var(--panel);border:2px inset var(--panel-border);padding:8px;min-height:0;overflow:auto;resize:both;min-width:220px;min-height:120px}.label{font-weight:bold;margin:5px 0;color:var(--text);}.status{background:var(--status-bg);color:var(--status-fg);padding:6px;min-height:29px}.transports{font-size:11px;color:var(--muted);margin-top:4px}.mono{font-family:inherit}textarea,input{width:100%;font:inherit;border:2px inset var(--input-border);background:var(--input-bg);color:var(--text);padding:5px}.identity{height:145px;resize:none}.contact{height:125px;resize:none}.small{font-size:11px;color:var(--muted)}.chat{height:100%;background:var(--chat-bg);border:2px inset var(--panel-border);padding:8px;overflow:auto;resize:both;min-height:180px;flex:1}.msg{margin:0 0 9px;white-space:pre-wrap;word-break:break-word}.msg.me{color:var(--accent)}.msg.peer{color:#2ecc71}.msg.sys{color:var(--muted)}.attachment{padding:6px;margin:6px 0;border:1px dashed var(--attachment-border);background:var(--attachment-bg)}.attachment a{color:var(--link);cursor:pointer;text-decoration:underline}.attachment a:hover{color:var(--accent)}.send{display:flex;gap:5px;margin-top:6px}.send textarea{height:62px;resize:none}.send .btn{width:94px}.footer{font-size:10px;padding:5px 8px;border-top:2px solid var(--toolbar-border);color:var(--muted)}.hidden{display:none}.progress{height:12px;background:var(--input-bg);border:1px inset var(--input-border)}.progress>div{height:100%;background:var(--accent-strong);width:0}.drop{border:2px dashed var(--drop-border);padding:8px;text-align:center;margin-top:5px;color:var(--text-weak)}.drop.drag{background:var(--drop-hover)}
@media(max-width:760px){body{min-width:0}.window{width:100vw;min-height:100vh}.toolbar{overflow-x:auto;white-space:nowrap;padding:6px}.toolbar .btn{min-height:42px;font-size:14px}.main{grid-template-columns:1fr;min-height:calc(100vh - 58px)}.side{display:block;max-height:42vh;overflow:auto}.side .panel{margin-top:6px!important}.chat{min-height:38vh;max-height:none}.send{position:sticky;bottom:0;background:#c0c0c0;padding-top:6px}.send textarea{height:70px;font-size:16px}.send .btn{width:100px;min-height:70px}.drop{min-height:54px;display:flex;align-items:center;justify-content:center}.contact,.identity{font-size:14px}.btn{min-height:40px}}
@media(min-width:761px){.window{width:100%;height:100%}}
  </style>
</head>
<body>
<div class="window" id="win">
  <div class="toolbar">
    <button class="btn" id="addBtn">Adicionar contato</button>
    <button class="btn" id="attachBtn">Enviar arquivo</button>
    <button class="btn" id="btBtn">Bluetooth</button>
    <button class="btn" id="cancelBtn" class="hidden">Cancelar</button>
    <button class="btn" id="copyBtn">Copiar meu contato</button>
    <button class="btn" id="configBtn">Configurações</button>
    <button class="btn" id="aboutBtn">Sobre</button>
    <button class="btn" id="debugBtn">Debug</button>
    <button class="btn" id="themeBtn" type="button">Tema: Escuro</button>
    <input id="fileInput" type="file" multiple class="hidden">
  </div>

  <div class="main">
    <aside class="side">
      <div class="panel">
        <div class="label">MINHA IDENTIDADE</div>
        <div class="status" id="status">Inicializando...</div>
        <div class="transports" id="transports"></div>
        <div class="label">Fingerprint</div>
        <input id="finger" readonly>
        <div class="label">Meu contato</div>
        <textarea id="mycontact" class="identity" readonly></textarea>
        <div class="small">A chave privada nunca é enviada. Este contato já inclui seu endereço de LAN e, quando o Tor terminar de iniciar, também o endereço Tor (para conectar pela internet).</div>
      </div>
      <div class="panel" style="margin-top:8px">
        <div class="label">CONTATO</div>
        <textarea id="peercontact" class="contact" placeholder="Cole o contato público aqui"></textarea>
        <button class="btn" id="connectBtn" style="width:100%">Adicionar e conectar</button>
        <div class="small" id="contactInfo"></div>
      </div>
    </aside>

    <section class="panel" style="display:flex;flex-direction:column;flex:1;min-height:0;height:100%">
      <div class="chat" id="chat"></div>
      <div class="drop" id="drop">Arraste fotos, vídeos, músicas ou qualquer arquivo para aqui</div>
      <div class="send">
        <textarea id="message" placeholder="Mensagem..."></textarea>
        <button class="btn" id="sendBtn">Enviar</button>
      </div>
    </section>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let info=null;
let knownFiles=new Set();
let connecting=false;
let tcpMode="standard";

function applyTheme(theme){
  const normalized = theme === 'light' ? 'light' : 'dark';
  document.body.dataset.theme = normalized;
  $('themeBtn').textContent = normalized === 'dark' ? 'Tema: Escuro' : 'Tema: Claro';
  try { localStorage.setItem('retrochat-theme', normalized); } catch (e) {}
}

function toggleTheme(){
  const next = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
}

async function api(path,opts={}){
  let r=await fetch(path,{cache:'no-store',...opts});
  let j=await r.json();
  if(!r.ok||j.error)throw new Error(j.error||'Erro');
  return j
}

function add(kind,text,extra=''){
  let d=document.createElement('div');
  d.className='msg '+kind;
  d.innerHTML=extra?extra:(kind==='me'?'EU: ':kind==='peer'?'PARCEIRO: ':'SISTEMA: ')+esc(text);
  $('chat').appendChild(d);
  $('chat').scrollTop=$('chat').scrollHeight
}

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))
}

let lastTorState=null;

async function refreshInfo(){
  try {
    info=await api('/api/info');
    $('finger').value=info.fingerprint;
    $('mycontact').value=info.contact;
  } catch(e) {}
}

async function init(){
  try {
    const saved = localStorage.getItem('retrochat-theme');
    applyTheme(saved || 'dark');
  } catch (e) {
    applyTheme('dark');
  }
  await refreshInfo();
  if(info) $('status').textContent=info.status;
  updateTransportStatus();
  await loadSettings();
  setInterval(poll,350)
}

async function updateTransportStatus(){
  try {
    let tor = await api('/api/tor/status');
    let status = [];
    if(tor.enabled) status.push('TOR (internet): ' + (tor.state || 'OFF'));
    $('transports').textContent = status.length ? status.join(' | ') : '';
    if (tor.state !== lastTorState) {
      lastTorState = tor.state;
      if (tor.state === 'ONLINE') {
        await refreshInfo();
      }
    }
  } catch(e) {}
}

async function loadSettings(){
  try {
    let settings = await api('/api/settings');
    tcpMode = (settings.tcp && settings.tcp.mode) || 'standard';
  } catch(e) {}
}

function updateConnectBtn(){
  if(connecting) {
    $('cancelBtn').classList.remove('hidden');
    $('connectBtn').disabled=true;
  } else {
    $('cancelBtn').classList.add('hidden');
    $('connectBtn').disabled=false;
  }
}

// Botões que abrem janelas separadas (usam API)
async function openSeparateWindow(endpoint){
  try {
    await api(endpoint, {method:'POST'});
  } catch(e) {
    $('status').textContent = 'Não foi possível abrir a janela: ' + e.message;
  }
}
$('configBtn').onclick = () => openSeparateWindow('/api/open_settings');
$('debugBtn').onclick = () => openSeparateWindow('/api/open_debug');
$('aboutBtn').onclick = () => openSeparateWindow('/api/open_about');

$('addBtn').onclick=async()=>{
  let c=prompt('Cole o contato público do parceiro:');
  if(!c)return;
  try{
    let x=await api('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contact:c})});
    $('peercontact').value=c;
    $('status').textContent='Contato aceito: '+x.fingerprint;
    await api('/api/connect',{method:'POST'});
    connecting=true;
    updateConnectBtn();
    $('status').textContent='Conectando...';
  } catch(e){
    $('status').textContent=e.message
  }
}

$('connectBtn').onclick=async()=>{
  let c=$('peercontact').value.trim();
  if(!c){
    $('status').textContent='Cole um contato antes de conectar.';
    return;
  }
  try{
    let x=await api('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contact:c})});
    $('status').textContent='Contato aceito: '+x.fingerprint;
    await api('/api/connect',{method:'POST'});
    connecting=true;
    updateConnectBtn();
    $('status').textContent='Conectando...';
  } catch(e){
    $('status').textContent=e.message
  }
};

$('cancelBtn').onclick=async()=>{
  try {
    await api('/api/cancel',{method:'POST'});
    connecting=false;
    updateConnectBtn();
    $('status').textContent='Conexão cancelada.';
  } catch(e) {
    $('status').textContent='Erro ao cancelar: '+e.message;
  }
}

$('sendBtn').onclick=send;
$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};

$('themeBtn').onclick=toggleTheme;

async function send(){
  let t=$('message').value.trim();
  if(!t)return;
  try{
    await api('/api/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
    add('me',t);
    $('message').value=''
  } catch(e){
    $('status').textContent=e.message
  }
}

$('attachBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>upload([...e.target.files]);

$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};
$('drop').ondragleave=()=>$('drop').classList.remove('drag');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');upload([...e.dataTransfer.files])};

async function upload(files){
  for(const f of files){
    $('status').textContent='Enviando '+f.name+'...';
    let fd=new FormData();
    fd.append('file',f);
    try{
      await api('/api/file',{method:'POST',body:fd});
      add('me','',`EU: <div class="attachment">📎 ${esc(f.name)} — ${Math.round(f.size/1024)} KB (enviando)</div>`)
    } catch(e){
      add('sys',e.message)
    }
  }
}

$('copyBtn').onclick = async () => {
    try {
        await refreshInfo(); // garante que info.contact está atualizado
        if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(info.contact);
        } else {
            let t = document.createElement('textarea');
            t.value = info.contact;
            document.body.appendChild(t);
            t.select();
            document.execCommand('copy');
            t.remove();
        }
        $('status').textContent = 'Contato copiado!';
    } catch(e) {
        $('status').textContent = 'Erro ao copiar: ' + e.message;
    }
};

$('btBtn').onclick=async()=>{
  try{
    await api('/api/bluetooth/scan',{method:'POST'});
    $('status').textContent='Procurando dispositivos Bluetooth por 5 segundos...'
  } catch(e){
    $('status').textContent=e.message
  }
}

async function poll(){
  try{
    let evs=await api('/api/poll');
    for(const e of evs){
      if(e[0]==='online'){
        $('status').textContent='ONLINE — '+e[1];
        connecting=false;
        updateConnectBtn();
      }
      else if(e[0]==='offline'){
        $('status').textContent='OFFLINE — '+e[1];
        connecting=false;
        updateConnectBtn();
      }
      else if(e[0]==='error'){
        $('status').textContent='ERRO — '+e[1];
        connecting=false;
        updateConnectBtn();
      }
      else if(e[0]==='message')add('peer',e[2]);
      else if(e[0]==='file_received'){
        let filename = e[1];
        // Cria um link que, ao clicar, chama a API para abrir o arquivo
        let link = document.createElement('a');
        link.href = '#';
        link.textContent = filename;
        link.style.cursor = 'pointer';
        link.style.textDecoration = 'underline';
        link.onclick = (ev) => {
            ev.preventDefault();
            fetch('/api/open_file', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: filename })
            }).then(r => r.json()).then(data => {
                if (data.error) alert('Erro: ' + data.error);
                else if (data.message) alert(data.message);
            }).catch(alert);
        };
        let container = document.createElement('div');
        container.className = 'attachment';
        container.innerHTML = '📎 ';
        container.appendChild(link);
        container.innerHTML += ` — ${Math.round(e[3]/1024)} KB`;
        add('peer','', container.outerHTML);
      }
      else if(e[0]==='file_progress'){
        $('status').textContent=`Arquivo ${e[4]}: ${e[2]}/${e[3]}`
      }
      else if(e[0]==='bt_devices'){
        $('status').textContent=e[1].length?('Bluetooth: '+e[1].map(x=>x.name+' ['+x.address+']').join(' | ')):'Nenhum Bluetooth encontrado.'
      }
    }
  } catch(e){}
  updateTransportStatus();
}

init();
</script>
</body>
</html>
